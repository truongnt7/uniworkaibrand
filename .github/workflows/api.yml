name: api
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aps/api typecheck
      - run: pnpm --filter @aps/api test
      - run: pnpm --filter @aps/api build
      # E2E chạy thật với PostgreSQL + MinIO (docker compose của apps/api).
      - name: Start PostgreSQL + MinIO
        working-directory: apps/api
        run: docker compose up -d --wait
      - run: pnpm --filter @aps/api test:e2e
      - name: Compose logs on failure
        if: failure()
        working-directory: apps/api
        run: docker compose logs --no-color
      - name: Stop infra
        if: always()
        working-directory: apps/api
        run: docker compose down -v
