# Đóng gói app: `dir` (Linux/Windows/macOS, để kiểm chứng) và NSIS x64 cho bản cài thử Windows (`pnpm package --installer`).
# Installer CHƯA ký số (Authenticode) và chưa notarize: ký số/notarize là P0-19. Không có khóa/chứng chỉ nào nằm trong cấu hình này.
# Chạy qua `pnpm package` (scripts/package.mjs) để có kiểm tra trước/sau khi đóng gói.
appId: vn.aiproductstudio.app
productName: AI Product Studio
electronVersion: 43.8.10
electronDist: node_modules/electron/dist
directories:
  output: ../../release-build
asar: true
npmRebuild: false
files:
  - out/**
  - package.json
extraResources:
  - from: ../../blender-worker
    to: blender-worker
    filter:
      - "**/*.py"
      - LICENSE
      - README.md
      - "!**/__pycache__/**"
      - "!tests/**"
  # scripts/package.mjs chép CHỈ *.pub.pem và manifest đã ký vào thư mục staging này sau khi kiểm tra.
  - from: .package-staging/keys/production
    to: keys/production
  - from: .package-staging/runtime-manifest.signed.json
    to: runtime-manifest.signed.json
  # Phông tiếng Việt (SIL OFL 1.1) cho chữ trên video; giữ OFL.txt cùng thư mục.
  - from: resources/fonts
    to: fonts
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # Nguyên văn giấy phép LGPL-3.0 của libheif-js (nghĩa vụ phân phối lại, xem THIRD_PARTY_NOTICES.md).
  - from: node_modules/libheif-js/LICENSE
    to: licenses/libheif-js-LICENSE
linux:
  executableName: ai-product-studio
  target: dir
  category: Graphics
win:
  executableName: AI Product Studio
  target:
    - target: nsis
      arch: [x64]
  artifactName: AI-Product-Studio-Trial-Setup-${version}-x64.${ext}
  # Bản thử CHƯA ký số: không đặt certificateFile/publisherName; Windows SmartScreen sẽ cảnh báo (docs/trial-guide.md).
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Product Studio
  # Gỡ app không xóa dữ liệu của khách (bài nháp, video, runtime đã tải).
  deleteAppDataOnUninstall: false
  language: "1066"
