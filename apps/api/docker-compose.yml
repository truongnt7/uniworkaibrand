# Hạ tầng chạy local: PostgreSQL + MinIO (S3-compatible).
# Image MinIO chính thức trên Docker Hub/Quay đã ngừng phát hành bản community,
# nên mặc định dùng bản build từ mã nguồn MinIO của coollabsio (ghim phiên bản).
# Đổi bằng biến MINIO_IMAGE (ví dụ S3/R2 thật thì không cần dịch vụ này).
name: aps-api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aps
      POSTGRES_PASSWORD: aps
      POSTGRES_DB: aps
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aps -d aps"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # Image không có curl/wget: kiểm tra bằng bash + /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ "$$line" == *" 200"* ]]'
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
